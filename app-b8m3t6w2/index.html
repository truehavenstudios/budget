:root{
  --bg:#F8F4F0;--bg2:#F1EBE5;--card:#FFFFFF;--ink:#2F2A27;--ink2:#6A615B;--ink3:#8C837C;
  --line:#EAE2DA;--line2:#DCD2C8;--shadow:0 1px 2px rgba(70,50,40,.05),0 10px 30px rgba(70,50,40,.06);
  --a:#94665F;--a1:#F4E6E3;--a2:#E7CDC8;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC;
  --ok:#3F6E48;--okbg:#E0EDE2;--warn:#86601B;--warnbg:#F6EBD3;--bad:#A0412F;--badbg:#F6DFDA;
  --p1:#E7A1A6;--p2:#9DCBA6;--p3:#B5A3D8;--p4:#97BFE0;--p5:#E3C08E;--p6:#F0AE95;--p7:#8FCFC6;--p8:#D39CC4;--p9:#C2C08A;--p10:#A3B1C4;
  --r:20px;--fs:16px;--serif:"Bodoni",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[data-theme="Sage"]{--a:#5E7C64;--a1:#E5EEE6;--a2:#C9DDCC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Lavender"]{--a:#76689A;--a1:#ECE7F4;--a2:#D6CCE8;--b:#4F7193;--b1:#E3ECF5;--b2:#C8D9EA}
[data-theme="Sky"]{--a:#4F7193;--a1:#E3ECF5;--a2:#C8D9EA;--b:#76689A;--b1:#ECE7F4;--b2:#D6CCE8}
[data-theme="Sand"]{--a:#8A6D4E;--a1:#F2E9DE;--a2:#E3D2BD;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC}
[data-theme="Stone"]{--a:#6B635D;--a1:#EEEAE6;--a2:#DAD3CC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Mocha"]{--a:#6F5146;--a1:#F1E6E0;--a2:#DDC8BE;--b:#A3603F;--b1:#F7E7DD;--b2:#ECCDB9}
[data-theme="Ocean"]{--a:#3F6B78;--a1:#E1EDF0;--a2:#C3DAE0;--b:#8A6D4E;--b1:#F2E9DE;--b2:#E3D2BD}
[data-theme="Plum"]{--a:#73465F;--a1:#F2E5EC;--a2:#E2C8D6;--b:#9A5F7E;--b1:#F6E8EF;--b2:#EBCFDD}
[data-theme="Noir"]{--a:#34302D;--a1:#ECE8E3;--a2:#D9D2C9;--b:#8C6F3A;--b1:#F4ECDC;--b2:#E6D5B2}
html[data-dark="1"]{
  --bg:#1B1918;--bg2:#24211F;--card:#2A2725;--ink:#F3EEEA;--ink2:#BDB4AD;--ink3:#8D847D;--line:#38332F;--line2:#4A443F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --ok:#9CC8A5;--okbg:#2B3A2E;--warn:#E3BA72;--warnbg:#3D3324;--bad:#EC9E8F;--badbg:#45302B;color-scheme:dark;
}
/* the theme sits on <body>; dark tints must be set there too or the light tints win */
html[data-dark="1"] body[data-theme],html[data-dark="1"]{--a1:color-mix(in srgb,var(--a) 30%,#2A2725);--a2:color-mix(in srgb,var(--a) 50%,#9A928B);--b1:color-mix(in srgb,var(--b) 30%,#2A2725);--b2:color-mix(in srgb,var(--b) 50%,#9A928B)}
html[data-dark="1"] body[data-theme="Noir"]{--a:#57504A}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.45}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.01em}
h1{font-size:2.1em;line-height:1.08;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.3em;line-height:1.2}
h3{font-size:1.05em}
.caps{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:.87em}.tiny{font-size:.77em}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.hidden{display:none!important}
.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}

/* ------------------------------------------------ layout */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:250px;flex:none;padding:24px 14px 20px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:1px}
.brand{padding:2px 12px 16px}
.brand .k{font-size:.62em;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.32em;display:block;line-height:1.1;margin-top:3px;letter-spacing:.02em}
.brand .arch{width:30px;height:34px;color:var(--a);margin-bottom:8px}
.navlabel{padding:14px 12px 5px;font-size:.64em}
.nav{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:11px;color:var(--ink);text-decoration:none;font-size:.94em;border:0;background:none;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:none;color:var(--ink2)}
.nav:hover{background:var(--bg2)}
.nav.on{background:var(--a);color:#fff;font-weight:500}
.nav.on svg{color:#fff}
.nav .badge{margin-left:auto}
.side .addbtn{margin:2px 0 6px;justify-content:center}
.main{flex:1;min-width:0;padding:28px 36px 120px;max-width:1240px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar .sub{margin-top:5px}
.topbar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}

.col{display:flex;flex-direction:column;gap:18px;min-width:0}

/* ------------------------------------------------ cards with a colored title band (our signature) */

.band .t{font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.band .r{font-size:.8em;opacity:.9;display:flex;gap:8px;align-items:center}
.band .lnk{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:20px;padding:4px 11px;font-size:.92em}
.band.soft .lnk,.band.softb .lnk{background:var(--card)}
.card>.body{padding:18px 20px}

/* key number tiles (like the spreadsheet) */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);text-align:center;min-width:0;display:flex;flex-direction:column}

.grid.start{align-items:start}
.tiles{grid-auto-rows:1fr}
.tile .h{background:var(--a1);font-size:.66em;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:8px 6px;color:var(--ink)}
.tile:nth-child(even) .h{background:var(--b1)}

/* hero: safe to spend */
.hero{background:var(--b1);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--b2) 60%,transparent);text-align:center;display:flex;flex-direction:column}
.hero .band{background:var(--b);color:#fff;padding:11px 16px;font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}

.big{font-family:var(--serif);font-weight:500;font-size:3.9em;line-height:1;letter-spacing:-.01em;display:inline-flex;align-items:flex-start;gap:2px;font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--card);border-radius:30px;padding:9px 16px;font-size:.92em;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}

.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:max(11.5px,.74em);font-weight:500;background:var(--a1);color:var(--ink);white-space:nowrap}
.badge.b{background:var(--b1)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.seg{display:inline-flex;background:var(--bg2);border-radius:30px;padding:3px;gap:2px;flex-wrap:wrap}

/* forms */

.switch.on{background:var(--b)}.switch.on:after{left:21px}
input[type=range]{width:100%;accent-color:var(--a)}

@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}

/* add sheet */
.kind{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:12px}

.amountview{text-align:center;padding:2px 0 6px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

<script>/* Budget Planner engine: dates, recurrence, month maths, paychecks, forecast, year, goals, debt, net worth. No DOM. */
const E = (() => {
  // ------------------------------------------------------------ dates (local, 'YYYY-MM-DD')
  const pad = n => String(n).padStart(2, "0");
  const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
  const diff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);           // days from a to b
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();                 // m 0-based
  const ym = s => s.slice(0, 7);
  const addMonths = (s, n, day) => {
    const d = pd(s); const y = d.getFullYear(), m = d.getMonth() + n;
    const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
    return `${yy}-${pad(mm + 1)}-${pad(Math.min(day || d.getDate(), dim(yy, mm)))}`;
  };
  const monthStart = s => s.slice(0, 8) + "01";
  const monthEnd = s => { const d = pd(s); return `${s.slice(0, 8)}${pad(dim(d.getFullYear(), d.getMonth()))}`; };
  const ymAdd = (m, n) => addMonths(m + "-01", n, 1).slice(0, 7);
  const dow = s => pd(s).getDay();
  const r2 = v => Math.round(v * 100) / 100;
  const sum = (a, f = x => x) => a.reduce((s, x) => s + (+f(x) || 0), 0);

  // ------------------------------------------------------------ recurrence
  // item: {start, freq:'once|weekly|biweekly|4weekly|semimonthly|monthly|quarterly|halfyearly|yearly', day2?, end?}
  const STEPM = { monthly: 1, quarterly: 3, halfyearly: 6, yearly: 12 };
  function occ(it, from, to) {
    const out = [];
    if (!it || !it.start || from > to) return out;
    const end = it.end && it.end < to ? it.end : to;
    const f = it.freq || "monthly";
    const push = s => { if (s >= from && s <= end && s >= it.start && out[out.length - 1] !== s) out.push(s); };
    if (f === "once") { push(it.start); return out; }
    if (f === "weekly" || f === "biweekly" || f === "4weekly") {
      const step = f === "weekly" ? 7 : f === "biweekly" ? 14 : 28;
      let k = Math.max(0, Math.ceil(diff(it.start, from) / step));
      for (let s = addDays(it.start, k * step); s <= end; s = addDays(s, step)) push(s);
      return out;
    }
    if (f === "semimonthly") {
      const d1 = pd(it.start).getDate(), d2 = it.day2 || (d1 <= 15 ? d1 + 15 : d1 - 15);
      let cur = monthStart(from < it.start ? it.start : from);
      while (cur <= end) {
        const y = pd(cur).getFullYear(), m = pd(cur).getMonth(), L = dim(y, m);
        [...new Set([Math.min(d1, d2), Math.max(d1, d2)])].forEach(d => push(`${cur.slice(0, 8)}${pad(Math.min(d, L))}`));
        cur = addMonths(cur, 1, 1);
      }
      return out;
    }
    const step = STEPM[f] || 1;
    const day = pd(it.start).getDate();
    const sm = pd(it.start), fm = pd(from);
    let k = Math.max(0, Math.floor(((fm.getFullYear() - sm.getFullYear()) * 12 + fm.getMonth() - sm.getMonth()) / step) - 1);
    for (let s = addMonths(it.start, k * step, day); s <= end; k++, s = addMonths(it.start, k * step, day)) push(s);
    return out;
  }
  const PER_MONTH = { weekly: 52 / 12, biweekly: 26 / 12, "4weekly": 13 / 12, semimonthly: 2, monthly: 1, quarterly: 1 / 3, halfyearly: 1 / 6, yearly: 1 / 12, once: 0 };
  const perMonth = it => (PER_MONTH[it.freq || "monthly"] || 0) * (+it.amount || 0);
  const OUTK = ["bill", "sub", "debt", "save"];

  // every recurring date between from..to (skipped ones left out). kinds: optional filter
  function recOcc(st, from, to, kinds) {
    const res = [];
    (st.rec || []).forEach(r => {
      if (r.off || (kinds && !kinds.includes(r.kind))) return;
      occ(r, from, to).forEach(date => { if (!(r.skip || {})[date]) res.push({ r, date, amount: +r.amount || 0, kind: r.kind }); });
    });
    return res.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : b.amount - a.amount);
  }
  const txs = (st, from, to, kind) => (st.tx || []).filter(t => t.date >= from && t.date <= to && (!kind || t.kind === kind));
  const catOf = (st, id) => (st.cats || []).find(c => c.id === id);
  const groupOf = (st, id) => (catOf(st, id) || {}).group || "want";

  // ------------------------------------------------------------ one month
  // planned = everything dated in the month (recurring + logged); actual = up to today
  function month(st, m, today) {
    const from = m + "-01", to = monthEnd(from), upto = to < today ? to : today, future = from > today;
    const R = recOcc(st, from, to), T = txs(st, from, to);
    const rk = (k, done) => sum(R.filter(o => o.kind === k && (!done || o.date <= upto)), o => o.amount);
    const tIn = sum(T.filter(t => t.kind === "in"), t => t.amount), tOut = T.filter(t => t.kind === "out");
    const goalAdds = sum((st.goals || []).flatMap(g => (g.history || []).filter(h => h.date >= from && h.date <= to && !h.rec)), h => h.amount);
    const debtExtra = sum((st.debts || []).flatMap(d => (d.history || []).filter(h => h.date >= from && h.date <= to && !h.rec)), h => h.amount);
    const incomePlan = rk("income") + tIn, incomeDone = rk("income", true) + tIn;
    const bills = rk("bill") + rk("sub"), billsDone = rk("bill", true) + rk("sub", true);
    const debtPay = rk("debt") + debtExtra, debtDone = rk("debt", true) + debtExtra;
    const saved = rk("save") + goalAdds, savedDone = rk("save", true) + goalAdds;
    const spent = sum(tOut, t => t.amount);
    const byCat = {};
    tOut.forEach(t => { byCat[t.cat] = (byCat[t.cat] || 0) + (+t.amount); });
    R.filter(o => o.kind === "bill" || o.kind === "sub").forEach(o => { const c = o.r.cat || "bills"; byCat[c] = (byCat[c] || 0) + o.amount; });
    const out = bills + debtPay + saved + spent;
    const days = dim(pd(from).getFullYear(), pd(from).getMonth());
    const daily = Array.from({ length: days }, () => 0);
    tOut.forEach(t => { daily[+t.date.slice(8) - 1] += +t.amount; });
    const lastDay = future ? 0 : +upto.slice(8);
    const noSpend = daily.slice(0, lastDay).filter((v, i) => v === 0 && (from.slice(0, 8) + pad(i + 1)) >= (st.created || "0000")).length;
    let needs = 0, wants = 0;
    Object.entries(byCat).forEach(([c, v]) => { if (groupOf(st, c) === "need" || c === "bills") needs += v; else wants += v; });
    const budget = sum(st.cats || [], c => c.budget);
    // safe to spend today (only in the current month)
    let safe = null;
    if (today >= from && today <= to) {
      const spentBefore = sum(tOut.filter(t => t.date < today), t => t.amount);
      const spentToday = sum(tOut.filter(t => t.date === today), t => t.amount);
      const left = incomePlan - bills - debtPay - saved - spentBefore;
      const daysLeft = diff(today, to) + 1;
      const perDay = left / daysLeft;
      safe = { left: left - spentToday, perDay, today: perDay - spentToday, spentToday, daysLeft, restAfter: left - spentToday,
        recLeft: sum(R.filter(o => o.date > today && o.kind !== "income"), o => o.amount), incomeLeft: sum(R.filter(o => o.date > today && o.kind === "income"), o => o.amount) };
    }
    return { m, from, to, upto, future, past: to < today, incomePlan, incomeDone, bills, billsDone, debtPay, debtDone, saved, savedDone, spent, out, net: incomePlan - out,
      byCat, daily, noSpend, needs, wants, saveDebt: saved + debtPay, budget, safe, rec: R, tx: T, count: tOut.length };
  }

  // ------------------------------------------------------------ paychecks: every bill goes to the pay before its date
  function paychecks(st, from, to) {
    const pays = recOcc(st, addDays(from, -62), addDays(to, 62), ["income"]);
    const extra = txs(st, addDays(from, -62), addDays(to, 62), "in").filter(t => t.paycheck).map(t => ({ date: t.date, amount: +t.amount, r: { name: t.note || "Pay" }, tx: t }));
    const all = [...pays, ...extra].sort((a, b) => a.date < b.date ? -1 : 1);
    const res = [];
    all.forEach((p, i) => {
      if (p.date < from || p.date > to) return;
      const next = all.slice(i + 1).find(q => q.date > p.date);
      const end = next ? addDays(next.date, -1) : addDays(p.date, 30);
      const items = recOcc(st, p.date, end, OUTK);
      const out = sum(items, o => o.amount);
      res.push({ date: p.date, end, amount: p.amount, name: p.r.name, items, out, left: p.amount - out, days: diff(p.date, end) + 1 });
    });
    return res;
  }

  // ------------------------------------------------------------ balances
  const everyday = st => (st.accounts || []).filter(a => a.type === "everyday" || a.type === "cash");
  // money in everyday accounts today: last balance check + everything that happened since
  function balanceNow(st, today) {
    const acc = everyday(st);
    if (!acc.length) return 0;
    const since = acc.reduce((m, a) => a.date && a.date < m ? a.date : m, today);
    let bal = sum(acc, a => a.amount);
    const R = recOcc(st, addDays(since, 1), today);
    R.forEach(o => { bal += o.kind === "income" ? o.amount : -o.amount; });
    txs(st, addDays(since, 1), today).forEach(t => { bal += t.kind === "in" ? +t.amount : -t.amount; });
    return bal;
  }
  // typical everyday spending per day: last 60 days of logged spending, or the budgets if there isn't enough yet
  function usualDaily(st, today) {
    const first = (st.tx || []).filter(t => t.kind === "out").reduce((m, t) => t.date < m ? t.date : m, today);
    const span = Math.min(60, diff(first, today));
    if (span >= 14) return sum(txs(st, addDays(today, -span), addDays(today, -1), "out"), t => t.amount) / span;
    const billCats = new Set((st.rec || []).filter(r => r.kind === "bill" || r.kind === "sub").map(r => r.cat));
    return sum((st.cats || []).filter(c => !billCats.has(c.id)), c => c.budget) / 30.4;
  }
  function forecast(st, today, days = 60, whatIf = null, perDay = null) {
    const start = balanceNow(st, today), pd_ = perDay == null ? usualDaily(st, today) : perDay;
    const R = recOcc(st, addDays(today, 1), addDays(today, days));
    const pts = [{ date: today, bal: start, ev: [] }];
    let bal = start, low = { date: today, bal: start };
    for (let i = 1; i <= days; i++) {
      const d = addDays(today, i), ev = R.filter(o => o.date === d);
      ev.forEach(o => { bal += o.kind === "income" ? o.amount : -o.amount; });
      bal -= pd_;
      if (whatIf && whatIf.date === d) bal -= whatIf.amount;
      pts.push({ date: d, bal, ev });
      if (bal < low.bal) low = { date: d, bal };
    }
    return { start, perDay: pd_, pts, low, end: bal, events: R };
  }

  // ------------------------------------------------------------ year
  function year(st, y, today) {
    const ms = Array.from({ length: 12 }, (_, i) => month(st, `${y}-${pad(i + 1)}`, today));
    const cats = {};
    ms.forEach((m, i) => Object.entries(m.byCat).forEach(([c, v]) => { (cats[c] = cats[c] || Array(12).fill(0))[i] += v; }));
    return { y, ms, cats, income: sum(ms, m => m.incomePlan), out: sum(ms, m => m.out), saved: sum(ms, m => m.saved), spent: sum(ms, m => m.spent), bills: sum(ms, m => m.bills), debt: sum(ms, m => m.debtPay) };
  }
  // costs that don't come every month in the next 12 months -> how much to put aside per month
  function pots(st, today) {
    const items = (st.rec || []).filter(r => !r.off && ["quarterly", "halfyearly", "yearly"].includes(r.freq) && r.kind !== "income");
    const to = addDays(today, 365);
    return items.map(r => {
      const next = occ(r, addDays(today, 1), to).find(d => !(r.skip || {})[d]);
      const months = next ? Math.max(1, Math.ceil(diff(today, next) / 30.44)) : 12;
      const g = (st.goals || []).find(x => x.pot === r.id);
      const have = g ? goalSaved(st, g, today) : 0;
      return { r, next, months, aside: Math.max(0, (+r.amount - have)) / months, steady: perMonth(r), have, goal: g };
    }).sort((a, b) => (a.next || "9") < (b.next || "9") ? -1 : 1);
  }

  // ------------------------------------------------------------ goals & debt (base value + what happened since)
  function goalSaved(st, g, today) {
    const recAdds = recOcc(st, addDays(g.asOf || g.created || today, 1), today, ["save"]).filter(o => o.r.goal === g.id);
    return (+g.saved || 0) + sum(recAdds, o => o.amount) + sum((g.history || []).filter(h => !h.rec && (h.date > (g.asOf || "0") || (h.date === g.asOf && (h.ts || 0) > (g.asTs || 0)))), h => h.amount);
  }
  function goalPace(st, g, today) {
    const saved = goalSaved(st, g, today), left = Math.max(0, g.target - saved);
    const recM = sum((st.rec || []).filter(r => !r.off && r.kind === "save" && r.goal === g.id), r => perMonth(r));
    const monthly = recM || +g.monthly || 0;
    const months = left <= 0 ? 0 : monthly > 0 ? Math.ceil(left / monthly) : Infinity;
    const need = g.by && left > 0 ? left / Math.max(1, Math.ceil(diff(today, g.by) / 30.44)) : null;
    return { saved, left, monthly, months, need, done: left <= 0, finish: months === Infinity ? null : addMonths(today, months), pct: g.target > 0 ? Math.min(1, saved / g.target) : 0 };
  }
  function debtBal(st, d, today) {
    const recPays = recOcc(st, addDays(d.asOf || today, 1), today, ["debt"]).filter(o => o.r.debt === d.id);
    const paid = sum(recPays, o => o.amount) + sum((d.history || []).filter(h => !h.rec && (h.date > (d.asOf || "0") || (h.date === d.asOf && (h.ts || 0) > (d.asTs || 0)))), h => h.amount);
    return Math.max(0, (+d.balance || 0) - paid);
  }
  function debtPlan(debts, extra, method) {
    let ds_ = debts.filter(d => d.bal > 0.005).map(d => ({ id: d.id, bal: +d.bal, apr: +d.apr || 0, min: +d.min || 0, ord: +d.order || 0 }));
    if (!ds_.length) return { months: 0, interest: 0, order: [], payoff: {}, path: [0] };
    const sorter = method === "avalanche" ? (a, b) => b.apr - a.apr || a.bal - b.bal : method === "custom" ? (a, b) => a.ord - b.ord : (a, b) => a.bal - b.bal || b.apr - a.apr;
    const order = [...ds_].sort(sorter).map(d => d.id);
    const budget = sum(ds_, d => d.min) + (+extra || 0);
    let month = 0, interest = 0; const payoff = {}, path = [sum(ds_, d => d.bal)];
    while (ds_.some(d => d.bal > 0.005) && month < 600) {
      month++;
      ds_.forEach(d => { if (d.bal > 0) { const i = d.bal * d.apr / 1200; interest += i; d.bal += i; } });
      let pot = budget;
      ds_.forEach(d => { if (d.bal > 0) { const p = Math.min(d.min, d.bal); d.bal -= p; pot -= p; } });
      for (const id of order) { const d = ds_.find(x => x.id === id); if (d.bal > 0 && pot > 0) { const p = Math.min(pot, d.bal); d.bal -= p; pot -= p; } }
      ds_.forEach(d => { if (d.bal <= 0.005 && !payoff[d.id]) { d.bal = 0; payoff[d.id] = month; } });
      path.push(sum(ds_, d => d.bal));
      if (month === 2 && path[2] >= path[0] - 0.01) return { months: Infinity, interest: Infinity, order, payoff, path };
    }
    return { months: month >= 600 ? Infinity : month, interest, order, payoff, path };
  }

  // ------------------------------------------------------------ net worth
  function netWorth(st, today) {
    const own = [], owe = [];
    (st.accounts || []).forEach(a => {
      const v = a.type === "everyday" || a.type === "cash" ? null : +a.amount;
      if (a.type === "credit") owe.push({ name: a.name, v: Math.abs(+a.amount), src: "account", id: a.id });
      else own.push({ name: a.name, v: v == null ? +a.amount : v, src: "account", id: a.id, type: a.type });
    });
    const evBal = balanceNow(st, today), evBase = sum(everyday(st), a => a.amount);
    // spread what happened since the balance checks over the everyday accounts (shown as one line)
    const evRows = own.filter(x => x.type === "everyday" || x.type === "cash");
    if (evRows.length) evRows[0].v += evBal - evBase;
    (st.debts || []).forEach(d => owe.push({ name: d.name, v: debtBal(st, d, today), src: "debt", id: d.id }));
    (st.assets || []).forEach(a => (a.kind === "owe" ? owe : own).push({ name: a.name, v: +a.value || 0, src: "asset", id: a.id, emoji: a.emoji }));
    (st.goals || []).filter(g => g.separate).forEach(g => own.push({ name: g.name, v: goalSaved(st, g, today), src: "goal", id: g.id }));
    const O = sum(own, x => x.v), W = sum(owe, x => x.v);
    return { own, owe, ownT: O, oweT: W, net: O - W };
  }

  return { pad, ds, pd, addDays, diff, dim, ym, ymAdd, addMonths, monthStart, monthEnd, dow, r2, sum, occ, perMonth, recOcc, txs, month, paychecks,
    balanceNow, usualDaily, forecast, year, pots, goalSaved, goalPace, debtBal, debtPlan, netWorth, OUTK };
})();
if (typeof module !== "undefined") module.exports = E;

  if (o.vals2) svg += `<path d="${o.vals2.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("")}" fill="none" stroke="${o.color2 || "var(--ink3)"}" stroke-width="1.8" stroke-dasharray="5 4"/>`;
  if (o.ref != null) svg += `<line x1="${L}" x2="${L + w}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.2"/>`;
  svg += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>`;

  if (o.mark) svg += `<circle cx="${X(o.mark[0])}" cy="${Y(vals[o.mark[0]])}" r="5" fill="none" stroke="var(--bad)" stroke-width="2"/>`;
  (o.labels || []).forEach(([i, t]) => { svg += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${esc(t)}</text>`; });

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--bg2)" stroke-width="${stroke}" fill="none"/>${segs}${center}</svg>`;

document.addEventListener("pointerover", e => {

const THEMES = { Blush: ["#94665F", "#5E7C64"], Sage: ["#5E7C64", "#94665F"], Lavender: ["#76689A", "#4F7193"], Sky: ["#4F7193", "#76689A"], Sand: ["#8A6D4E", "#5E7C64"],

function applyTheme() {

  document.body.setAttribute("data-theme", THEMES[st.theme] ? st.theme : "Blush");
  const dark = st.dark === "on" || (st.dark === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);

// ------------------------------------------------------------ modal / toast
let modalOpen = null;
function modal(title, body, foot = "", opts = {}) {
  closeModal(true);
  const el = document.createElement("div");
  el.className = "scrim"; el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g, ""))}" style="${opts.wide ? "max-width:" + (opts.wide === true ? 640 : opts.wide) + "px" : ""}"><div class="mh"><h2>${title}</h2><button class="iconbtn" data-act="close" aria-label="Close">${ic("x")}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ""}</div>`;
  el.addEventListener("click", e => { if (e.target === el) closeModal(); });
  document.body.appendChild(el); modalOpen = el;
  const f = el.querySelector("[autofocus]"); if (f && matchMedia("(min-width:761px)").matches) setTimeout(() => { f.focus(); f.select && f.select(); }, 50);
  return el.querySelector(".modal");
}
function closeModal(silent) { if (modalOpen) { modalOpen.remove(); modalOpen = null; } }
addEventListener("keydown", e => { if (e.key === "Escape" && modalOpen) closeModal(); });
let toastT = null;
function toast(msg, act, label = "Undo") {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${msg}</span>${act ? `<button>${label}</button>` : ""}`;
  if (act) t.querySelector("button").onclick = () => { act(); t.remove(); };
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), act ? 6500 : 3200);
}

// ------------------------------------------------------------ router
const NAV = [
  ["Every day", [["home", "Dashboard", "home"], ["spending", "Spending & budget", "bag"], ["bills", "Bills & income", "repeat"], ["calendar", "Calendar", "cal"]]],
  ["Plan ahead", [["paychecks", "Paycheck plan", "pay"], ["forecast", "Look ahead", "wave"], ["year", "Year", "year"], ["goals", "Savings goals", "goal"], ["debt", "Debt payoff", "debt"]]],

const ROUTES = NAV.flatMap(g => g[1].map(x => x[0]));
function route() { const r = (location.hash || "").replace(/^#\/?/, "").split("?")[0]; return ROUTES.includes(r) ? r : "home"; }

/* views 1: shell, dashboard, spending & budget, bills & income, calendar, paycheck plan */

function cancelSoon() { const t = today(); return S.rec.filter(r => !r.off && r.cancelBy && r.cancelBy >= t && E.diff(t, r.cancelBy) <= 7); }

// ------------------------------------------------------------ dashboard
function vHome() {
  const t = today(), m = curMonth(), M = E.month(S, m, t), name = S.settings.name;

  }

    ${tile("Income", fmt0(M.incomeDone), isNow || M.future ? `expected ${fmt0(M.incomePlan)}` : "")}
    ${tile("Spending", fmt0(M.spent), `budget ${fmt0(spendBudget)}`, M.spent > spendBudget && spendBudget ? "bad" : "")}
    ${tile("Bills & subs", fmt0(M.bills), isNow ? `${fmt0(M.billsDone)} paid so far` : `${M.rec.filter(o => o.kind === "bill" || o.kind === "sub").length} payments`)}
    ${tile("Saved", fmt0(M.saved), `savings rate ${pct(M.saved, M.incomePlan)}`, "ok")}
    ${tile("Debt paid", fmt0(M.debtPay), S.debts.length ? `${fmt0(E.sum(S.debts, d => E.debtBal(S, d, t)))} still owed` : "no debts added")}
    ${tile("No-spend days", M.future ? "–" : M.noSpend, `goal ${S.settings.nospendGoal}`, M.noSpend >= S.settings.nospendGoal ? "ok" : "")}</div>`;
  // cash flow planned vs actual
  const flowS = [
    { name: "planned", color: "var(--a2)", vals: [M.incomePlan, M.needs, M.wants, M.saved, M.debtPay] },
    { name: isNow ? "so far" : "actual", color: "var(--a)", vals: [M.incomeDone, needsDone(M), wantsDone(M), M.savedDone, M.debtDone] }];
  const cash = card("Cash flow · planned vs actual", barChart(flowS, ["Income", "Needs", "Wants", "Savings", "Debt"], { w: 360, h: 230, label: "Cash flow" }) +
    `<div class="hleg"><span><i style="background:var(--a2)"></i>planned</span><span><i style="background:var(--a)"></i>${isNow ? "so far" : "actual"}</span></div>`);
  // expense breakdown

  const dp = top.map(([c, v]) => ({ name: catOf(c).name, v, color: catOf(c).color })); if (rest) dp.push({ name: "Everything else", v: rest, color: "var(--line2)" });

    <div class="legend">${dp.map(p => legendRow(p.color, p.name, pct(p.v, tot))).join("")}</div></div>` : `<div class="empty">Nothing spent yet in ${MONTHS[+m.slice(5) - 1]}.</div>`, { b: true });
  // 50/30/20
  const [tn, tw, ts] = S.settings.split, inc = M.incomePlan || 1;
  const sp = [{ name: "Needs", v: M.needs, color: "var(--b)" }, { name: "Wants", v: M.wants, color: "var(--b2)" }, { name: "Savings & debt", v: M.saveDebt, color: "var(--a)" }, { name: "Left", v: Math.max(0, M.incomePlan - M.needs - M.wants - M.saveDebt), color: "var(--line2)" }];
  const split = card(`${tn} / ${tw} / ${ts} split`, `<div class="donutwrap">${donut(sp, 132, 24)}<div class="legend">
    ${legendRow("var(--b)", "Needs", `${pct(M.needs, inc)} <span class="faint tiny">/ ${tn}%</span>`)}${legendRow("var(--b2)", "Wants", `${pct(M.wants, inc)} <span class="faint tiny">/ ${tw}%</span>`)}
    ${legendRow("var(--a)", "Savings & debt", `${pct(M.saveDebt, inc)} <span class="faint tiny">/ ${ts}%</span>`)}${legendRow("var(--line2)", "Left", pct(sp[3].v, inc))}<div class="tiny faint">actual / target</div></div></div>`);

    `<div class="hleg"><span><i style="background:var(--b)"></i>spent per day</span>${avg ? `<span><i style="background:none;border-top:2px dashed var(--ink2);height:0;width:14px;border-radius:0"></i>average ${fmt(avg)}</span>` : ""}</div>`, { b: true });

  const coming = card(isNow ? "Coming up · next 30 days" : `Repeats in ${MONTHS[+m.slice(5) - 1]}`, up.length ? `<div class="list">${up.map(o => `<div class="item click" data-act="editRec" data-id="${o.r.id}">${dateBox(o.date, o.kind === "income" ? "ok" : "a")}<div class="grow"><div class="nm">${esc(o.r.name)}</div><div class="tiny muted">${KIND[o.kind][0]} · ${isNow ? rel(o.date) : FREQ[o.r.freq]}</div></div><span class="amt ${o.kind === "income" ? "in" : ""}">${o.kind === "income" ? "+" : ""}${fmt(o.amount)}</span></div>`).join("")}</div>` : `<div class="empty">Nothing repeating yet. <button class="link" data-act="newRec">Add a bill or payday</button></div>`, { right: `<button class="lnk" data-go="bills">All</button>`, tight: true });

  return topH + `${isNow ? `<div style="margin-bottom:18px">${nextStep(M)}</div>` : ""}<div class="grid g12">${hero}${tiles}</div>

    <div class="grid g21 mt start">${daily}${coming}</div>
    <div class="grid g21 mt start">${bva}${goals}</div>

}
function needsDone(M) { return doneBy(M, "need"); }
function wantsDone(M) { return doneBy(M, "want"); }
function doneBy(M, grp) {
  let v = 0;
  M.tx.filter(x => x.kind === "out" && x.date <= M.upto).forEach(x => { if ((catOf(x.cat).group || "want") === grp) v += +x.amount; });
  M.rec.filter(o => (o.kind === "bill" || o.kind === "sub") && o.date <= M.upto).forEach(o => { const g = o.r.cat ? catOf(o.r.cat).group : "need"; if ((g || "want") === grp) v += o.amount; });
  return M.future ? 0 : v;
}
// the one thing worth doing right now (never a wall of tasks)
function nextStep(M) {
  const t = today(), soon = cancelSoon()[0];
  const loggedToday = S.tx.some(x => x.date === t), said = (S.nothing || {})[t];
  const dueSoon = E.recOcc(S, t, E.addDays(t, 1), ["bill", "sub", "debt"])[0];
  const over = S.cats.filter(c => c.budget > 0 && (M.byCat[c.id] || 0) > c.budget && !S.rec.some(r => r.cat === c.id)).sort((a, b) => (M.byCat[b.id] - b.budget) - (M.byCat[a.id] - a.budget))[0];
  let ico = "✨", txt = "You're on track. Nothing needs you right now.", btns = "";
  if (soon) { ico = "⏰"; txt = `<b>${esc(soon.name)}</b> renews soon – cancel ${rel(soon.cancelBy) === "today" ? "today" : "by " + dshort(soon.cancelBy)} if you don't want it.`; btns = `<button class="btn sm" data-act="cancelled" data-id="${soon.id}">I cancelled it</button><button class="btn sm" data-act="editRec" data-id="${soon.id}">Keep it</button>`; }
  else if (!loggedToday && !said) { ico = "📝"; txt = "Spent anything today? Logging it keeps your number honest."; btns = `<button class="btn sm pri" data-act="add">${ic("plus")}Log a spend</button><button class="btn sm" data-act="nothingToday">Nothing today</button>`; }
  else if (dueSoon) { ico = "🧾"; txt = `<b>${esc(dueSoon.r.name)}</b> (${fmt(dueSoon.amount)}) goes out ${rel(dueSoon.date)}. It's already taken off your number.`; }
  else if (over) { ico = "🌿"; txt = `<b>${esc(over.name)}</b> is ${fmt(M.byCat[over.id] - over.budget)} over its budget this month. No stress – maybe go easy on it for a few days.`; }
  return `<section class="card nextcard"><div class="body row" style="gap:14px"><div class="emo" style="font-size:1.3em;width:44px;height:44px;background:var(--a1)">${ico}</div><div class="grow"><div class="caps" style="font-size:.64em">One thing right now</div><div style="margin-top:2px">${txt}</div></div>${btns ? `<div class="row wrap nbtns" style="gap:6px;justify-content:flex-end">${btns}</div>` : ""}</div></section>`;
}
// first steps for new users – ticks itself off, can be hidden

function budRow(c, v, edit) {

// ------------------------------------------------------------ spending & budget
function vSpending() {
  const t = today(), m = curMonth(), M = E.month(S, m, t);
  const billCats = new Set(S.rec.filter(r => r.kind === "bill" || r.kind === "sub").map(r => r.cat));
  const budgeted = E.sum(S.cats, c => c.budget);
  const everydayB = E.sum(S.cats.filter(c => !billCats.has(c.id)), c => c.budget);
  const daysLeft = m === E.ym(t) ? E.diff(t, M.to) + 1 : 0;
  const tiles = `<div class="tiles">${tile("Spent", fmt0(M.spent), "everyday spending")}${tile("Budgeted", fmt0(everydayB), `${fmt0(budgeted)} incl. bills`)}${tile("Left in the plan", fmt0(everydayB - M.spent), daysLeft ? `${daysLeft} days to go` : "", everydayB - M.spent < 0 ? "bad" : "ok")}</div>`;
  const tab = VS.tab;
  let body;
  if (tab === "budget") {
    const groups = [["need", "Needs"], ["want", "Wants"]];
    body = `<div class="grid g2 mt">${groups.map(([g, lab], i) => {
      const cs = S.cats.filter(c => (c.group || "want") === g);

      return card(`${lab} · ${fmt0(sp)} of ${fmt0(bu)}`, cs.map(c => budRow(c, M.byCat[c.id] || 0, true)).join("") || `<div class="empty">No categories here.</div>`, { b: i === 1, tight: true, right: i === 0 ? `<button class="lnk" data-act="newCat">+ Category</button>` : "" });
    }).join("")}</div><p class="tiny faint">Bills & subscriptions count in their category on their date. Tap a category to change its budget, name or emoji.</p>`;
  } else {
    const q = VS.q.trim().toLowerCase(), k = VS.txk;
    let list = M.tx.filter(x => k === "both" || x.kind === k);
    if (q) list = (S.tx).filter(x => (k === "both" || x.kind === k) && [x.note, catOf(x.cat).name, String(x.amount), (x.tags || []).join(" ")].join(" ").toLowerCase().includes(q.replace(/^#/, "")));
    list = [...list].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.ts || 0) - (a.ts || 0));

      const c = catOf(x.cat);

    });
    const tags = [...new Set(S.tx.flatMap(x => x.tags || []))].slice(0, 8);
    body = card(q ? `Search · ${list.length} found` : `Every purchase · ${MONTHS[+m.slice(5) - 1]}`, `<div class="row wrap" style="margin-bottom:10px"><div class="seg">${[["out", "Spending"], ["in", "Money in"], ["both", "Both"]].map(([v, l]) => `<button class="${k === v ? "on" : ""}" data-act="txk" data-v="${v}">${l}</button>`).join("")}</div>
      <input class="inp grow" id="q" placeholder="Search, like “coffee”, “12.50” or “#holiday”" value="${esc(VS.q)}" style="min-width:200px"></div>
      ${tags.length ? `<div class="row wrap" style="gap:6px;margin-bottom:6px">${tags.map(g => `<button class="cat" data-act="tagq" data-v="${esc(g)}">#${esc(g)}</button>`).join("")}</div>` : ""}
      <div class="list">${rows || `<div class="empty">${q ? "Nothing matches." : "Nothing logged this month yet."}</div>`}</div>`, { cls: "mt", right: `<button class="lnk" data-act="importCsv">Import bank file</button><button class="lnk" data-act="exportCsv">Export</button>` });

}

// ------------------------------------------------------------ bills & income (everything that repeats)

  }).join("")}</div>` : `<div class="empty">Nothing in ${MONTHS[+m.slice(5) - 1]}.</div>`, { tight: true, right: `<span>${fmt(E.sum(occs.filter(o => o.kind !== "income"), o => o.amount))} out · ${fmt(E.sum(occs.filter(o => o.kind === "income"), o => o.amount))} in</span>` });

// ------------------------------------------------------------ calendar
function vCalendar() {
  const t = today(), m = curMonth(), M = E.month(S, m, t), ws = S.settings.weekStart;
  const first = m + "-01", pad0 = (E.dow(first) - ws + 7) % 7, days = M.daily.length;
  const cells = [];
  for (let i = 0; i < pad0; i++) cells.push(`<div class="cday out"></div>`);
  for (let d = 1; d <= days; d++) {
    const date = `${m}-${E.pad(d)}`, ev = M.rec.filter(o => o.date === date), sp = M.daily[d - 1];

      ${ev.slice(0, 3).map(o => `<div class="ev ${o.kind}" title="${esc(o.r.name)}">${o.kind === "income" ? "+" : ""}${esc(fmt0(o.amount))} ${esc(o.r.name)}</div>`).join("")}${ev.length > 3 ? `<div class="ev spend">+${ev.length - 3} more</div>` : ""}

}

    <div class="caps" style="margin:14px 0 4px">Logged</div>${tx.length ? `<div class="list">${tx.map(x => `<div class="item click" data-act="editTx" data-id="${x.id}"><div class="emo">${x.kind === "in" ? "💰" : esc(catOf(x.cat).emoji)}</div><div class="grow nm">${esc(x.note || catOf(x.cat).name)}</div><span class="amt ${x.kind === "in" ? "in" : ""}">${x.kind === "in" ? "+" : "−"}${fmt(x.amount)}</span></div>`).join("")}</div>` : `<div class="empty">Nothing logged${date <= today() ? " – a no-spend day ★" : ""}.</div>`}`,

// ------------------------------------------------------------ paycheck plan

  const cards = P.map((p, i) => {
    const items = p.items;
    return card(`${p.date <= t && p.end >= t ? "This paycheck · " : ""}${esc(p.name)} · ${dshort(p.date)}`, `<div class="row sb" style="margin-bottom:10px"><div><div class="caps">covers</div><div class="small">${dshort(p.date)} – ${dshort(p.end)} · ${p.days} days</div></div><div style="text-align:right"><div class="caps">pay</div><div class="serif" style="font-size:1.5em">${fmt(p.amount)}</div></div></div>
      <div class="list">${items.map(o => `<div class="item click" data-act="editRec" data-id="${o.r.id}">${dateBox(o.date, "a")}<div class="grow"><div class="nm">${esc(o.r.name)}</div><div class="tiny muted">${KIND[o.kind][0]}</div></div><span class="amt">−${fmt(o.amount)}</span></div>`).join("") || `<div class="empty">No bills before the next paycheck.</div>`}</div>
      <div class="row sb" style="border-top:2px solid var(--line2);padding-top:10px;margin-top:4px"><span class="nm">Left for everyday & extra</span><span class="serif ${p.left < 0 ? "badc" : "okc"}" style="font-size:1.4em">${fmt(p.left)}</span></div>
      <div class="tiny muted" style="margin-top:4px">${p.left >= 0 ? `about ${fmt(p.left / p.days)} a day until the next pay` : "this paycheck doesn't cover its bills – move a bill or set money aside from the one before"}</div>`, { b: i % 2 === 1 });

/* views 2: look ahead, year, savings goals, debt payoff, net worth, monthly review */

// ------------------------------------------------------------ look ahead (forecast)
function vForecast() {
  const t = today(), N = VS.fdays, wi = VS.wi > 0 ? { amount: VS.wi, date: E.addDays(t, clamp(VS.wiDay, 1, N)) } : null;
  if (!S.accounts.some(a => a.type === "everyday" || a.type === "cash")) return head("The next 90 days", "Look ahead") + `<div class="empty">Add an everyday account with its balance in Settings to see your balance day by day.</div>`;
  const F = E.forecast(S, t, N, wi), base = wi ? E.forecast(S, t, N) : null;
  const vals = F.pts.map(p => p.bal);
  const dots = []; F.pts.forEach((p, i) => p.ev.forEach(o => dots.push([i, o.kind === "income" ? "var(--ok)" : o.kind === "debt" ? "var(--bad)" : o.kind === "save" ? "var(--b)" : "var(--a)", `${dshort(p.date)} · ${o.r.name} ${o.kind === "income" ? "+" : "−"}${fmt(o.amount)}`])));
  const lowI = F.pts.findIndex(p => p.date === F.low.date);
  const labels = [[0, dshort(t)], [Math.round(N / 3), dshort(E.addDays(t, Math.round(N / 3)))], [Math.round(2 * N / 3), dshort(E.addDays(t, Math.round(2 * N / 3)))], [N, dshort(E.addDays(t, N))]];
  const accts = S.accounts.filter(a => a.type === "everyday" || a.type === "cash"), oldest = accts.reduce((m, a) => a.date < m ? a.date : m, t);
  const chart = lineChart(vals, { h: 250, dots, mark: [lowI], labels, ref: 0, vals2: base ? base.pts.map(p => p.bal) : null, tips: i => `${dshort(F.pts[i].date)} · about ${fmt0(F.pts[i].bal)}`, label: "Balance forecast" });
  const verdict = !wi ? "" : (() => {
    const lowW = F.low.bal;
    return lowW < 0 ? `<b class="badc">Tight:</b> you'd dip to about ${fmt0(lowW)} on ${dshort(F.low.date)}. Waiting until after your next payday helps.` : `<b class="okc">Looks okay:</b> your lowest point would still be about ${fmt0(lowW)} on ${dshort(F.low.date)}.`;
  })();

// ------------------------------------------------------------ savings goals
function emergency() {
  const t = today(), ms = [1, 2, 3].map(i => E.month(S, E.ymAdd(E.ym(t), -i), t)).filter(m => m.incomePlan || m.out);
  const avgOut = ms.length ? E.sum(ms, m => m.bills + m.spent + m.debtPay) / ms.length : 0;
  const ef = S.goals.find(g => /emergency|safety|rainy/i.test(g.name));
  const have = ef ? E.goalSaved(S, ef, t) : E.sum(S.accounts.filter(a => a.type === "savings"), a => a.amount);
  return { avgOut, have, months: avgOut ? have / avgOut : 0, ef, target: avgOut * S.settings.safetyMonths };
}
function vGoals() {

    ${em.ef && Math.abs(em.ef.target - em.target) > 50 ? `<button class="btn sm mt" data-act="setEf" data-id="${em.ef.id}" data-v="${Math.round(em.target)}">Set ${esc(em.ef.name)} to ${fmt0(em.target)}</button>` : !em.ef ? `<button class="btn sm mt" data-act="newGoal" data-name="Emergency fund" data-v="${Math.round(em.target)}">Start an emergency fund</button>` : ""}` : `<div class="muted small">Once you've logged a month, this shows how many months your savings would cover.</div>`, { soft: "softb" });
  const gcards = paces.map(({ g, p }, i) => `<section class="card goal"><div class="band ${i % 2 ? "b" : ""}"><span class="t">${esc(g.emoji || "🎯")} ${esc(g.name)}</span><span class="r"><button class="lnk" data-act="editGoal" data-id="${g.id}">Edit</button></span></div><div class="body">

// ------------------------------------------------------------ debt payoff
function vDebt() {
  const t = today(), st = S.settings;
  if (!S.debts.length) return head("Paying it off", "Debt payoff", addBtn("Add a debt", "newDebt")) + `<div class="empty">Add your cards and loans – you'll see your debt-free date and the fastest order to pay them.</div>`;
  const D = S.debts.map(d => ({ ...d, bal: E.debtBal(S, d, t) }));
  const plan = m => E.debtPlan(D, st.extra, m), P = plan(st.method), P0 = E.debtPlan(D, 0, st.method);
  const total = E.sum(D, d => d.bal), mins = E.sum(D, d => d.min);
  const fin = P.months === Infinity ? null : E.addMonths(t, P.months);
  const sooner = P0.months === Infinity || P.months === Infinity ? null : P0.months - P.months, saved = P0.interest - P.interest;
  const n = Math.max(P.path.length, Math.min(P0.path.length, 360));
  const v1 = Array.from({ length: n }, (_, i) => P.path[i] ?? 0), v0 = Array.from({ length: n }, (_, i) => P0.path[Math.min(i, P0.path.length - 1)] ?? 0);
  const chart = lineChart(v1, { h: 210, vals2: v0, color: "var(--a)", labels: [[0, "Now"], [Math.floor((n - 1) / 2), mshort(E.ym(E.addMonths(t, Math.floor((n - 1) / 2))))], [n - 1, mshort(E.ym(E.addMonths(t, n - 1)))]], tips: i => `${mshort(E.ym(E.addMonths(t, i)))} · ${fmt0(v1[i])} left`, label: "Debt over time" });
  const methods = [["snowball", "❄️ Snowball", "smallest first"], ["avalanche", "🔥 Avalanche", "highest interest first"], ["custom", "✋ My order", "your own order"]];
  const comp = methods.map(([k, l, s]) => { const q = plan(k); return `<button class="card pad" data-act="method" data-v="${k}" style="text-align:left;cursor:pointer;${st.method === k ? "border:2px solid var(--a)" : ""}"><div class="row sb"><b>${l}</b>${st.method === k ? '<span class="badge">your plan</span>' : ""}</div><div class="serif" style="font-size:1.35em;margin-top:4px">${q.months === Infinity ? "never" : mname(E.ym(E.addMonths(t, q.months)))}</div><div class="tiny muted">${s} · ${q.interest === Infinity ? "–" : fmt0(q.interest)} interest</div></button>`; }).join("");
  const rows = P.order.map((id, i) => { const d = D.find(x => x.id === id); return `<div class="item click" data-act="editDebt" data-id="${d.id}"><div class="emo">${i + 1}</div><div class="grow"><div class="nm">${esc(d.name)}</div><div class="tiny muted">${(+d.apr || 0).toFixed(2)}% · min ${fmt0(d.min)}${d.dueDay ? ` on the ${d.dueDay}${["th", "st", "nd", "rd"][(d.dueDay % 10 < 4 && Math.floor(d.dueDay / 10) !== 1) ? d.dueDay % 10 : 0]}` : ""} · gone ${P.payoff[d.id] ? mshort(E.ym(E.addMonths(t, P.payoff[d.id]))) : "–"}</div></div><div style="text-align:right"><div class="amt">${fmt(d.bal)}</div><button class="link tiny" data-act="debtPay" data-id="${d.id}">Log a payment</button></div></div>`; }).join("");
  return head("Paying it off", "Debt payoff", addBtn("Add a debt", "newDebt"), "Your debt-free date – and the fastest way to get there.") +
    `<div class="grid g12"><div class="hero"><div class="band">Debt-free</div><div class="in"><div class="bigdate">${fin ? mname(E.ym(fin)) : "Not yet"}</div><div class="muted small" style="margin-top:4px">${fin ? `in ${P.months} months · ${fmt0(total)} to go` : "the payments don't cover the interest – add a little extra"}</div>
      <div style="width:100%;max-width:360px;margin-top:16px"><div class="row sb small"><span>Extra each month</span><b class="serif" style="font-size:1.3em">${fmt0(st.extra)}</b></div><input type="range" id="extra" min="0" max="${Math.max(500, Math.ceil(mins / 100) * 100)}" step="10" value="${st.extra}"></div>
      <div class="row wrap" style="justify-content:center;gap:6px;margin-top:8px">${sooner > 0 ? `<span class="badge ok">${sooner} months sooner than minimums only</span>` : ""}${saved > 1 && isFinite(saved) ? `<span class="badge">${fmt0(saved)} less interest</span>` : ""}</div></div></div>
      ${card("Balance over time", chart + `<div class="hleg"><span><i style="background:var(--a)"></i>with your plan</span><span><i style="background:none;border-top:2px dashed var(--ink3);height:0;width:14px;border-radius:0"></i>minimums only</span></div>`, { b: true })}</div>
    <div class="grid g3 mt">${comp}</div>` + card(`Your order · ${fmt0(total)} owed · ${fmt0(mins)} minimums`, `<div class="list">${rows}</div><p class="tiny faint">Balances are what you entered, less the payments since. Update them from your statement now and then. The date is an estimate that adds interest each month.</p>`, { cls: "mt", tight: true });
}

// ------------------------------------------------------------ net worth
function recordWorth() {
  if (DEMO) return;
  const t = today(), W = E.netWorth(S, t), k = E.ym(t), h = S.nwHist[k];
  if (!h || Math.abs(h.own - W.ownT) > .5 || Math.abs(h.owe - W.oweT) > .5) { S.nwHist[k] = { own: E.r2(W.ownT), owe: E.r2(W.oweT) }; save(); }
}

// ------------------------------------------------------------ monthly review

  const t = today(), m = curMonth(), M = E.month(S, m, t), L = E.month(S, E.ymAdd(m, -1), t);
  const inc = M.incomePlan, flow = [["Bills & subs", M.bills, "var(--a)"], ["Everyday spending", M.spent, "var(--a2)"], ["Debt", M.debtPay, "var(--bad)"], ["Savings", M.saved, "var(--b)"]];

  const flowBar = `<div class="flow">${flow.filter(f => f[1] > 0).map(f => `<i style="flex:${f[1]};background:${f[2]}" data-tip="${esc(f[0] + ": " + fmt(f[1]))}"></i>`).join("")}${left > 0 ? `<i style="flex:${left};background:var(--b2)" data-tip="Left over: ${esc(fmt(left))}"></i>` : ""}</div>

    ["Savings rate", pct(M.saved, inc), M.saved / (inc || 1) >= S.settings.split[2] / 100 ? "ok" : "", `target ${S.settings.split[2]}%`],
    ["Spending vs budget", fmt0(M.spent), "", `budget ${fmt0(E.sum(S.cats.filter(c => !S.rec.some(r => (r.kind === "bill" || r.kind === "sub") && r.cat === c.id)), c => c.budget))}`],
    ["No-spend days", M.future ? "–" : String(M.noSpend), M.noSpend >= S.settings.nospendGoal ? "ok" : "", `goal ${S.settings.nospendGoal}`],
    ["Vs last month", (M.out <= L.out ? "▼ " : "▲ ") + fmt0(Math.abs(M.out - L.out)), M.out <= L.out ? "ok" : "bad", (M.out <= L.out ? "less" : "more") + (m === E.ym(t) ? " so far than all of " + MON[+L.m.slice(5) - 1] : " went out")]];
  // no-spend challenge: 12 mini calendars
  const minis = Array.from({ length: 12 }, (_, i) => {
    const k = `${y}-${E.pad(i + 1)}`, MM = E.month(S, k, t), f = (E.dow(k + "-01") - ws + 7) % 7;

    MM.daily.forEach((v, d) => { const date = `${k}-${E.pad(d + 1)}`; const past = date <= t && date >= (S.created || ""); cells += `<i class="${past ? (v ? "sp" : "ns") : ""}">${d + 1}</i>`; });
    return `<div><h4><span>${MONTHS[i]}</span><span class="tiny ${MM.noSpend >= S.settings.nospendGoal ? "okc" : "muted"}">${MM.future ? "" : MM.noSpend + " ★"}</span></h4><div class="mini">${cells}</div></div>`;
  }).join("");

    `<div class="tiles" style="grid-template-columns:repeat(4,minmax(0,1fr))">${checks.map(c => tile(c[0], c[1], c[3], c[2])).join("")}</div>

    <div class="grid g3 mt">${card("Biggest purchases", bigL, { tight: true })}${card("Spending by weekday", wdChart, { b: true })}${card("Savings rate · 12 months", barChart([{ name: "saved", color: "var(--a)", vals: sr }], ms12.map(x => MON[+x.m.slice(5) - 1].slice(0, 1)), { w: 360, h: 220, ref: S.settings.split[2], label: "Savings rate", fv: v => Math.round(v) + "%" }) + `<div class="tiny muted">dashed line = your ${S.settings.split[2]}% target</div>`)}</div>` +
    card(`No-spend challenge ${y} · goal ${S.settings.nospendGoal} days a month`, `<div class="minis">${minis}</div><div class="hleg"><span><i style="background:var(--b)"></i>no-spend day</span><span><i style="background:var(--a1)"></i>spent something</span></div>`, { cls: "mt" });
}

/* forms: add/edit spending, repeats, categories, goals, debts, assets, accounts, afford */
const num = v => { if (v == null) return NaN; let s = String(v).trim().replace(/[^\d,.\-]/g, ""); if (/,\d{1,2}$/.test(s) && !/\.\d/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, ""); return parseFloat(s); };
const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
const opt = (v, l, sel) => `<option value="${esc(v)}" ${String(v) === String(sel) ? "selected" : ""}>${esc(l)}</option>`;
const field = (label, inner, help = "") => `<div class="field"><label>${label}</label>${inner}${help ? `<div class="help">${help}</div>` : ""}</div>`;
const inp = (id, v = "", o = {}) => `<input class="inp" id="${id}" value="${esc(v)}" ${o.type ? `type="${o.type}"` : ""} ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} ${o.num ? 'inputmode="decimal"' : ""} ${o.auto ? "autofocus" : ""} ${o.extra || ""}>`;
const moneyInp = (id, v, o = {}) => inp(id, v === "" || v == null ? "" : String(E.r2(+v)), { ...o, num: true, ph: o.ph || "0.00" });
function bad(msg) { toast(msg); return false; }

// ------------------------------------------------------------ spending / money in
let TXK = "out", TXCAT = null;
function txModal(x, date) {
  const isNew = !x; x = x || { kind: "out", date: date || today(), amount: "", cat: null, note: "", tags: [] };
  TXK = x.kind; TXCAT = x.cat || (S.cats.find(c => c.id === "groceries") || S.cats[0]).id;

  const body = `<div class="kind"><button data-act="txKind" data-v="out" class="${TXK === "out" ? "on" : ""}">− Spending</button><button data-act="txKind" data-v="in" class="${TXK === "in" ? "on" : ""}">+ Money in</button></div>
    <div class="amountview"><input id="txA" inputmode="decimal" placeholder="${esc(symbol())}0.00" value="${x.amount === "" ? "" : esc(String(x.amount))}" autofocus aria-label="Amount"></div>
    <div class="plus">${[1, 5, 10, 20].map(n => `<button data-act="txPlus" data-v="${n}">+${n}</button>`).join("")}<button data-act="txPlus" data-v="0" style="background:none">Clear</button></div>
    <div id="txCats" class="${TXK === "in" ? "hidden" : ""}"><div class="caps">What for</div><div class="cats">${S.cats.map(c => `<button class="cat ${c.id === TXCAT ? "on" : ""}" data-act="txCat" data-id="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("")}</div></div>

    <div class="frow">${accts.length > 1 ? field("Account", `<select class="inp" id="txAc">${accts.map(a => opt(a.id, a.name, x.acct || accts[0].id)).join("")}</select>`) : ""}${field("Tags (optional)", inp("txT", (x.tags || []).join(", "), { ph: "holiday, birthday" }))}</div>`;

  const a = $("#txA"); a && a.addEventListener("keydown", e => { if (e.key === "Enter") ACT.saveTx({ id: isNew ? "" : x.id }); });
}
function saveTx(id) {
  const amount = num(val("txA"));

  const date = val("txD") || today();
  const data = { kind: TXK, amount: E.r2(amount), date, note: val("txN").trim(), cat: TXK === "out" ? TXCAT : null, acct: val("txAc") || (S.accounts[0] || {}).id, tags: val("txT").split(",").map(s => s.trim().replace(/^#/, "")).filter(Boolean) };
  commit(() => {
    if (id) { const x = S.tx.find(t => t.id === id); Object.assign(x, data); }
    else S.tx.push({ id: uid(), ts: now(), ...data });
  }, id ? "edit" : "add");
  closeModal(); render();
  if (!id) toast(`${data.kind === "in" ? "+" : "−"}${fmt(data.amount)} ${data.kind === "in" ? "added" : "logged"}${data.kind === "out" ? " · " + esc(catOf(data.cat).name) : ""}`, () => undo());
}

// ------------------------------------------------------------ repeats
function recModal(r, kind) {
  const isNew = !r, t = today();
  r = r || { kind: kind || "bill", name: "", amount: "", freq: kind === "income" ? "biweekly" : "monthly", start: t, cat: kind === "sub" ? "subs" : "" };
  const next = isNew ? r.start : (E.recOcc({ rec: [r] }, t, E.addDays(t, 400))[0] || {}).date || r.start;
  const kinds = Object.entries(KIND).map(([k, [l]]) => opt(k, l, r.kind)).join("");
  const body = `${field("What is it?", inp("rN", r.name, { ph: "Rent, Netflix, Paycheck…", auto: true }))}
    <div class="frow">${field("Amount", moneyInp("rA", r.amount))}${field("Type", `<select class="inp" id="rK">${kinds}</select>`)}</div>
    <div class="frow">${field("How often", `<select class="inp" id="rF">${Object.entries(FREQ).map(([k, l]) => opt(k, l[0].toUpperCase() + l.slice(1), r.freq)).join("")}</select>`)}${field(isNew ? "Next date" : "Next date", inp("rS", next, { type: "date" }))}</div>
    <div class="frow" id="rRowCat">${field("Category", `<select class="inp" id="rC">${opt("", "—", r.cat)}${S.cats.map(c => opt(c.id, c.emoji + " " + c.name, r.cat)).join("")}</select>`)}${field("Ends (optional)", inp("rE", r.end || "", { type: "date" }))}</div>
    <div id="rRowGoal">${S.goals.length ? field("Goes to goal", `<select class="inp" id="rG">${opt("", "—", r.goal)}${S.goals.map(g => opt(g.id, g.name, r.goal)).join("")}</select>`) : ""}</div>
    <div id="rRowDebt">${S.debts.length ? field("Pays off", `<select class="inp" id="rD">${opt("", "—", r.debt)}${S.debts.map(d => opt(d.id, d.name, r.debt)).join("")}</select>`) : ""}</div>
    <div id="rRowCancel">${field("Cancel by (optional)", inp("rX", r.cancelBy || "", { type: "date" }), "A free trial or something you want to stop – it shows up as a reminder a week before.")}</div>
    ${!isNew && r.start < t ? `<p class="help">Changing the amount keeps past months as they were – the new amount starts from the next date.</p>` : ""}`;
  modal(isNew ? `New ${KIND[r.kind][0].toLowerCase()}` : esc(r.name), body, `${isNew ? "" : `<button class="btn danger" data-act="delRec" data-id="${r.id}">${ic("trash")}Remove</button>`}<button class="btn pri" data-act="saveRec" data-id="${isNew ? "" : r.id}">Save</button>`);
  const sync = () => { const k = val("rK"); $("#rRowCat").style.display = k === "income" || k === "save" ? "none" : ""; $("#rRowGoal").style.display = k === "save" ? "" : "none"; $("#rRowDebt").style.display = k === "debt" ? "" : "none"; $("#rRowCancel").style.display = k === "sub" || k === "bill" ? "" : "none"; };
  $("#rK").addEventListener("change", sync); sync();
}
function saveRec(id) {
  const t = today(), name = val("rN").trim(), amount = num(val("rA")), start = val("rS");
  if (!name) return bad("Give it a name."); if (!(amount >= 0) || isNaN(amount)) return bad("Type the amount."); if (!start) return bad("Pick the next date.");
  const k = val("rK");
  const data = { name, amount: E.r2(amount), kind: k, freq: val("rF"), cat: k === "income" || k === "save" ? "" : val("rC"), end: val("rE") || "", goal: k === "save" ? val("rG") : "", debt: k === "debt" ? val("rD") : "", cancelBy: k === "sub" || k === "bill" ? val("rX") : "" };
  if (data.end && data.end < start) return bad("The end date is before the next date.");
  commit(() => {
    if (!id) { S.rec.push({ id: uid(), start, added: t, skip: {}, ...data }); return; }
    const r = S.rec.find(x => x.id === id);
    const hadPast = r.start < t && E.recOcc({ rec: [r] }, r.start, E.addDays(t, -1)).length;
    if (hadPast && (Math.abs(r.amount - data.amount) > .001 || r.freq !== data.freq || start !== (E.recOcc({ rec: [r] }, t, E.addDays(t, 400))[0] || {}).date)) {
      // keep history: the old one stops before the new date, a copy carries on from there
      const oldEnd = r.end; r.end = E.addDays(start < t ? t : start, -1);
      if (r.end < r.start) r.end = r.start;
      const nr = { ...r, ...data, id: uid(), start, skip: {}, end: data.end || oldEnd || "" };
      if (Math.abs(r.amount - data.amount) > .001 && (k === "sub" || k === "bill")) { nr.priceFrom = r.amount; nr.priceAt = t; }
      S.rec.push(nr);
      if (r.end < r.start) S.rec = S.rec.filter(x => x !== r);
    } else Object.assign(r, data, { start: hadPast ? r.start : start });
  }, id ? "edit repeat" : "add repeat");
  closeModal(); render(); toast(id ? "Saved." : `${esc(name)} added – it counts by itself on its dates.`);
}
function delRecModal(id) {
  const r = S.rec.find(x => x.id === id), t = today(), past = r.start < t;
  modal(`Remove ${esc(r.name)}?`, past ? `<p>Do you want to keep it in past months?</p>` : `<p>It will be removed completely.</p>`,
    `${past ? `<button class="btn" data-act="stopRec" data-id="${id}">Stop from today, keep the past</button>` : ""}<button class="btn danger" data-act="killRec" data-id="${id}">Delete everywhere</button>`);
}

function saveGoal(id) {
  const t = today(), name = val("gN").trim(), target = num(val("gT")), saved = num(val("gS")) || 0, monthly = num(val("gM")) || 0, day = clamp(parseInt(val("gDay")) || 1, 1, 28);
  if (!name) return bad("Give it a name."); if (!(target > 0)) return bad("Type a target amount.");
  commit(() => {
    let g = id && S.goals.find(x => x.id === id);
    const base = { name, emoji: val("gE").trim().slice(0, 4) || "🎯", target: E.r2(target), by: val("gB"), separate: $("#gSep").checked, monthly: E.r2(monthly) };
    if (!g) { g = { id: uid(), created: t, history: [], ...base }; S.goals.push(g); } else Object.assign(g, base);
    g.saved = E.r2(saved); g.asOf = t; g.asTs = now();

    else if (lr && monthly > 0 && (Math.abs(lr.amount - monthly) > .001 || E.pd(lr.start).getDate() !== day)) { lr.end = E.addDays(nextD, -1); if (lr.end < lr.start) S.rec = S.rec.filter(r => r !== lr); S.rec.push({ ...lr, id: uid(), amount: E.r2(monthly), start: nextD, end: "", name: "To " + name }); }

function saveDebt(id) {

function parseCSV(text) {

  const first = text.split(/\r?\n/).find(l => l.trim()) || "";

  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell.trim()); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell.trim()); if (row.some(c => c !== "")) rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell.trim()); if (row.some(c => c !== "")) rows.push(row);

}

};

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); closeModal(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) { if (e.target.closest(".modal a.nav")) closeModal(); return; }
  const f = ACT[a.dataset.act]; if (!f) return;
  e.preventDefault(); f(a.dataset, a);
});
let qT = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "q") { clearTimeout(qT); qT = setTimeout(() => { VS.q = el.value; const pos = el.selectionStart; render(); const n = $("#q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 220); return; }
  if (el.id === "wiA" || el.id === "wiD") { if (el.id === "wiA") VS.wi = +el.value; else VS.wiDay = +el.value; clearTimeout(qT); qT = setTimeout(render, 30); return; }
  if (el.id === "extra") { S.settings.extra = +el.value; save(); clearTimeout(qT); qT = setTimeout(render, 30); return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.set) { setSetting(el.dataset.set, el.value); render(); return; }
  if (el.id === "safetyM") { S.settings.safetyMonths = +el.value; save(); render(); return; }
  if (el.dataset.imp) { IMP[el.dataset.imp] = el.dataset.imp === "df" || el.dataset.imp === "sign" || el.dataset.imp === "dec" ? el.value : +el.value; const keep = IMP.rows; importModal(); return; }
  if (el.dataset.impon) { IMP.rows[+el.dataset.impon].on = el.checked; refreshImpBtn(); return; }
  if (el.dataset.impcat) { const r = IMP.rows[+el.dataset.impcat]; r.cat = el.value || null; r.picked = true; refreshImpBtn(); return; }
  if (el.id === "impRem") IMP.remember = el.checked;
});
function refreshImpBtn() { const n = IMP.rows.filter(r => r.on).length, need = IMP.rows.filter(r => r.on && r.kind === "out" && !r.cat).length, b = $('[data-act="impGo"]'); if (b) { b.disabled = !n; b.textContent = `Add ${n} rows${need ? ` · ${need} without category` : ""}`; } }
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "z" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !modalOpen) { e.preventDefault(); undo(); } });

// service worker for offline use (only when served over http/https)
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol) && !window.BP_NO_SW) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
render();
</script>
</body></html>
